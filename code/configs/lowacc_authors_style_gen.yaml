model:
  name: meta-llama/Llama-3.1-8B-Instruct
  trust_remote_code: false
  max_seq_length: 1024

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules:
    - q_proj
    - k_proj
    - v_proj

data:
  train_path: splits/lowacc_authors/train.jsonl
  eval_path: splits/lowacc_authors/eval.jsonl
  test_path: splits/lowacc_authors/test.jsonl
  summary_facts_path: splits/lowacc_authors/stage1_lowacc_atomic_facts_concat.jsonl
  summary_field: content_pack
  text_field: text
  author_field: author
  max_seq_length: 1024
  seed: 1234

training:
  #output_dir: outputs/llama3_lowacc_literary_style_gen_authors10
  output_dir: outputs_generator/llama3_lowacc_style_gen_with_summary
  num_train_epochs: 4
  per_device_train_batch_size: 12
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 30
  bf16: true
  gradient_checkpointing: true
  max_grad_norm: 0.3
  eval_strategy: steps
  save_strategy: steps
  logging_strategy: steps
  pad_to_multiple_of: 8

generation:
  max_new_tokens: 1024

loss_logging:
  # csv_path: outputs/llama3_lowacc_literary_style_gen_authors10/loss_history.csv
  # plot_path: outputs/llama3_lowacc_literary_style_gen_authors10/loss_curve.png
  csv_path: outputs_generator/llama3_lowacc_style_gen_with_summary/loss_history.csv
  plot_path: outputs_generator/llama3_lowacc_style_gen_with_summary/loss_curve.png

