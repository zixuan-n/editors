# Full-parameter BERT AA: warm-up classification, atomic-fact MLM, and deflated classification.
# Select dataset-specific paths and settings with --dataset DATASET.
# Shared settings below apply to all five datasets.
default_dataset: Gutenberg30
seed: 1234
method: full
model:
  model_name_or_path: bert-base-cased
  max_seq_length: 512
data:
  text_field: text
  label_field: author
  stage1_text_field: text
  max_seq_length: 512
deflation:
  basis_type: full_deltaW
  basis_solver: svd
  basis_tol: 1.0e-06
  max_rank: 8
  include_module:
  - query
  - key
  - value
  sample_every: 10
stages:
  stage0:
    training:
      overwrite_output_dir: true
      num_train_epochs: 4
      per_device_train_batch_size: 16
      per_device_eval_batch_size: 32
      learning_rate: 2.0e-05
      warmup_ratio: 0.1
      weight_decay: 1.0e-05
      logging_steps: 50
      eval_strategy: epoch
      save_strategy: epoch
      save_total_limit: 2
      load_best_model_at_end: true
      metric_for_best_model: eval_macro_f1
      greater_is_better: true
      report_to: none
      seed: 1234
      dataloader_num_workers: 0
      remove_unused_columns: true
  stage1:
    mlm_probability: 0.15
    training:
      overwrite_output_dir: true
      num_train_epochs: 4
      per_device_train_batch_size: 16
      per_device_eval_batch_size: 32
      learning_rate: 5.0e-05
      warmup_ratio: 0.05
      weight_decay: 0.01
      logging_steps: 50
      eval_strategy: epoch
      save_strategy: epoch
      save_total_limit: 2
      report_to: none
      seed: 1234
      dataloader_num_workers: 0
      remove_unused_columns: false
  stage3:
    training:
      overwrite_output_dir: true
      num_train_epochs: 4
      per_device_train_batch_size: 16
      per_device_eval_batch_size: 32
      learning_rate: 2.0e-05
      warmup_ratio: 0.1
      weight_decay: 1.0e-05
      logging_steps: 50
      eval_strategy: epoch
      save_strategy: epoch
      save_total_limit: 2
      load_best_model_at_end: true
      metric_for_best_model: eval_macro_f1
      greater_is_better: true
      report_to: none
      seed: 1234
      dataloader_num_workers: 0
      remove_unused_columns: true

dataset_variants:
  # CCAT10: paths and outputs used only for CCAT10.
  CCAT10:
    data:
      train_path: data/CCAT10/train.jsonl
      eval_path: data/CCAT10/eval.jsonl
      test_path: data/CCAT10/test.jsonl
      stage1_train_path: data/CCAT10/stage1_atomic_facts_train.jsonl
      stage1_eval_path: data/CCAT10/stage1_atomic_facts_eval.jsonl
    deflation:
      log_csv: outputs/bert_deflation/ccat10/full/s3_deflated/deflation_stats.csv
      save_u_sem: stage_evaluation/u_sem_bert_full_ccat10_deltaW_svd.pt
    stages:
      stage0:
        output_dir: outputs/bert_deflation/ccat10/full/s0
        training:
          output_dir: outputs/bert_deflation/ccat10/full/s0
      stage1:
        output_dir: outputs/bert_deflation/ccat10/full/s1_atomic_cpt
        stage0_checkpoint_path: outputs/bert_deflation/ccat10/full/s0
        training:
          output_dir: outputs/bert_deflation/ccat10/full/s1_atomic_cpt
      stage3:
        output_dir: outputs/bert_deflation/ccat10/full/s3_deflated
        stage0_checkpoint_path: outputs/bert_deflation/ccat10/full/s0
        stage1_checkpoint_path: outputs/bert_deflation/ccat10/full/s1_atomic_cpt
        training:
          output_dir: outputs/bert_deflation/ccat10/full/s3_deflated

