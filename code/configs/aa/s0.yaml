# AA warm-up training.
# Select with --dataset DATASET --model_variant MODEL.
# Shared fields apply to every dataset; dataset overrides are applied before model overrides.
# Models: Llama3, Gemma2, Mistral, Phi4mini (only listed combinations are available).
default_dataset: CCAT50
default_model: Llama3
model:
  device_map:
    ? ''
    : 0
  trust_remote_code: false
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
data:
  seed: 1234
prompt:
  answer_prefix: ' '
training:
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: cosine
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10

dataset_variants:
  # CCAT10: use these data paths, outputs, and model settings only for CCAT10.
  # Available models: Llama3.
  CCAT10:
    model:
      name: meta-llama/Llama-3.1-8B-Instruct
      torch_dtype: bfloat16
    quantization:
      bnb_4bit_compute_dtype: bfloat16
    lora:
      target_modules:
      - q_proj
      - k_proj
      - v_proj
    data:
      train_path: data/CCAT10/train.jsonl
      eval_path: data/CCAT10/eval.jsonl
      test_path: data/CCAT10/test.jsonl
      max_seq_length: 1000
    prompt:
      system_prompt: You are an expert literary analyst. Identify the author of the provided passage based on their writing style instead of the content. Answer with only the exact author name.
      template: auto
    training:
      num_train_epochs: 2
      per_device_train_batch_size: 12
      per_device_eval_batch_size: 4
      gradient_checkpointing_kwargs:
        use_reentrant: false
      eval_strategy: epoch
      save_strategy: epoch
      save_total_limit: 2
      report_to: none
      seed: 1234
      output_dir: outputs/aa/Llama3_CCAT10/s0
    model_variants:
      Llama3: {}

  # CCAT50: use these data paths, outputs, and model settings only for CCAT50.
  # Available models: Llama3, Gemma2, Mistral, Phi4mini.
  CCAT50:
    data:
      train_path: data/CCAT50/train.jsonl
      eval_path: data/CCAT50/eval.jsonl
      test_path: data/CCAT50/test.jsonl
    training:
      num_train_epochs: 2
    model_variants:
      # meta-llama/Llama-3.1-8B-Instruct on CCAT50: 2 epochs, max length 1000.
      Llama3:
        model:
          name: meta-llama/Llama-3.1-8B-Instruct
          torch_dtype: bfloat16
        quantization:
          bnb_4bit_compute_dtype: bfloat16
        lora:
          target_modules:
          - q_proj
          - k_proj
          - v_proj
        data:
          max_seq_length: 1000
        prompt:
          system_prompt: You are an expert literary analyst. Identify the author of the provided passage based on their writing style instead of the content. Answer with only the exact author name.
          template: auto
        training:
          per_device_train_batch_size: 12
          per_device_eval_batch_size: 4
          gradient_checkpointing_kwargs:
            use_reentrant: false
          eval_strategy: epoch
          save_strategy: epoch
          save_total_limit: 2
          report_to: none
          seed: 1234
          output_dir: outputs/aa/Llama3_CCAT50/s0
      # google/gemma-2-9b-it on CCAT50: 2 epochs, max length 1000.
      Gemma2:
        model:
          name: google/gemma-2-9b-it
          max_seq_length: 1000
        quantization:
          bnb_4bit_compute_dtype: bfloat16
        lora:
          target_modules:
          - q_proj
          - k_proj
          - v_proj
        data:
          eval_require_distinct_titles: true
        training:
          output_dir: outputs/cross_model_evaluators/s0/Gemma2_CCAT50
          per_device_train_batch_size: 6
          per_device_eval_batch_size: 1
          eval_steps: 200
          save_steps: 200
          save_total_limit: 6
          max_grad_norm: 0.3
          eval_strategy: steps
          save_strategy: steps
          logging_strategy: steps
          pad_to_multiple_of: 8
        generation:
          max_new_tokens: 8
        loss_logging:
          csv_path: outputs/cross_model_evaluators/s0/Gemma2_CCAT50/loss_history.csv
          plot_path: outputs/cross_model_evaluators/s0/Gemma2_CCAT50/loss_curve.png
        prompt:
          system_prompt: "You are an expert literary analyst. Identify the author of the provided passage based on their writing style instead of the content. Answer with only the exact author name. \n"
          template: |
            <start_of_turn>user
            {system_prompt}

            Passage:
            {passage}
            Author:
            <end_of_turn>
            <start_of_turn>model
      # mistralai/Mistral-7B-Instruct-v0.3 on CCAT50: 2 epochs, max length 1000.
      Mistral:
        model:
          name: mistralai/Mistral-7B-Instruct-v0.3
          max_seq_length: 1000
        quantization:
          bnb_4bit_compute_dtype: bfloat16
        lora:
          target_modules:
          - q_proj
          - k_proj
          - v_proj
        data:
          eval_require_distinct_titles: true
        training:
          output_dir: outputs/cross_model_evaluators/s0/Mistral_CCAT50
          per_device_train_batch_size: 10
          per_device_eval_batch_size: 1
          eval_steps: 200
          save_steps: 200
          save_total_limit: 6
          max_grad_norm: 0.3
          eval_strategy: steps
          save_strategy: steps
          logging_strategy: steps
          pad_to_multiple_of: 8
        generation:
          max_new_tokens: 8
        loss_logging:
          csv_path: outputs/cross_model_evaluators/s0/Mistral_CCAT50/loss_history.csv
          plot_path: outputs/cross_model_evaluators/s0/Mistral_CCAT50/loss_curve.png
        prompt:
          system_prompt: "You are an expert literary analyst. Identify the author of the provided passage based on their writing style instead of the content. Answer with only the exact author name. \n"
          template: |-
            <s>[INST] {system_prompt}

            Passage:
            {passage}
            Author: [/INST]
      # microsoft/Phi-4-mini-instruct on CCAT50: 2 epochs, max length 1000.
      Phi4mini:
        model:
          name: microsoft/Phi-4-mini-instruct
          max_seq_length: 1000
        quantization:
          bnb_4bit_compute_dtype: float16
        lora:
          target_modules:
          - qkv_proj
        data:
          eval_require_distinct_titles: true
        training:
          output_dir: outputs/cross_model_evaluators/s0/Phi4mini_CCAT50
          per_device_train_batch_size: 6
          per_device_eval_batch_size: 1
          eval_steps: 200
          save_steps: 200
          save_total_limit: 6
          max_grad_norm: 0.3
          eval_strategy: steps
          save_strategy: steps
          logging_strategy: steps
          pad_to_multiple_of: 8
        generation:
