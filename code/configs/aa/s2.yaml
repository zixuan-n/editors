          - v_proj
          sample_every: 10
          log_topk: 5
          log_csv: outputs/cross_model_evaluators/s2/Mistral_stage2_CCAT50_deltaW/deflation_stats.csv
          save_u_sem: stage_evaluation/u_sem_Mistral_CCAT50_deltaW.pt
        data:
