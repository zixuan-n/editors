# AA training with semantic deflation.
# Select with --dataset DATASET --model_variant MODEL.
# Shared fields apply to every dataset; dataset overrides are applied before model overrides.
# Models: Llama3, Gemma2, Mistral, Phi4mini (only listed combinations are available).
default_dataset: CCAT50
default_model: Llama3
model:
  device_map:
    ? ''
    : 0
  trust_remote_code: false
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
data:
  seed: 1234
prompt:
  answer_prefix: ' '
deflation:
  basis_type: deltaW
  basis_solver: svd
training:
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: cosine
  bf16: true
  logging_steps: 10

dataset_variants:
  # CCAT10: use these data paths, outputs, and model settings only for CCAT10.
  # Available models: Llama3.
  CCAT10:
    model:
      name: meta-llama/Llama-3.1-8B-Instruct
      torch_dtype: bfloat16
      stage2_adapter_path: outputs/aa/Llama3_CCAT10/s0
      stage1_adapter_path: outputs/aa/Llama3_CCAT10/s1
    quantization:
      bnb_4bit_compute_dtype: bfloat16
    lora:
      target_modules:
      - q_proj
      - k_proj
      - v_proj
    data:
      train_path: data/CCAT10/train.jsonl
      eval_path: data/CCAT10/eval.jsonl
      test_path: data/CCAT10/test.jsonl
      max_seq_length: 1000
    prompt:
      system_prompt: You are an expert literary analyst. Identify the author of the provided passage based on their writing style instead of the content. Answer with only the exact author name.
      template: auto
    deflation:
      basis_tol: 1.0e-06
      include_module:
      - q_proj
      - k_proj
      - v_proj
      save_u_sem: outputs/aa/Llama3_CCAT10/s2/deflation_basis.pt
      log_topk: 0
    training:
      num_train_epochs: 4
      per_device_train_batch_size: 12
      gradient_checkpointing: true
      gradient_checkpointing_kwargs:
        use_reentrant: false
      eval_strategy: epoch
      save_strategy: epoch
      save_total_limit: 2
      report_to: none
      seed: 1234
      output_dir: outputs/aa/Llama3_CCAT10/s2
    model_variants:
      Llama3: {}

  # CCAT50: use these data paths, outputs, and model settings only for CCAT50.
  # Available models: Llama3, Gemma2, Mistral, Phi4mini.
  CCAT50:
    data:
      train_path: data/CCAT50/train.jsonl
      eval_path: data/CCAT50/eval.jsonl
      test_path: data/CCAT50/test.jsonl
      max_seq_length: 1000
    training:
      num_train_epochs: 4
    model_variants:
