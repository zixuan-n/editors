          label_field: author
        prompt:
          system_prompt: "You are an expert literary analyst. Identify the author of the provided passage based on their writing style instead of the content. Answer with only the exact author name. \n"
          template: |-
            <s>[INST] {system_prompt}

            Passage:
            {passage}
            Author: [/INST]
        training:
