          - k_proj
          - v_proj
        deflation:
          basis_tol: 1e-6
          include_module:
          - q_proj
          - k_proj
          - v_proj
          sample_every: 10
          log_topk: 5
          log_csv: outputs/cross_model_evaluators/s2/Gemma2_stage2_CCAT50_deltaW/deflation_stats.csv
          save_u_sem: stage_evaluation/u_sem_Gemma2_CCAT50_deltaW.pt
        data:
