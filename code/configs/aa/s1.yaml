      Phi4mini:
        model:
          model_name_or_path: microsoft/Phi-4-mini-instruct
          torch_dtype: float16
          attn_implementation: null
          load_in_8bit: false
          bnb_4bit_compute_dtype: float16
          adapter_name_or_path: outputs/cross_model_evaluators/s0/Phi4mini_CCAT50
          adapter_is_trainable: true
          merge_adapter: true
        data:
          preprocessing_num_workers: 4
          max_seq_length: 768
          shuffle: true
        lora:
          adapter_name: stage1
          target_modules:
          - qkv_proj
        training:
          output_dir: outputs/cross_model_evaluators/s1/Phi4mini_stage1_CCAT50
          num_train_epochs: 4
          per_device_train_batch_size: 4
          per_device_eval_batch_size: 1
          logging_strategy: steps
          save_strategy: steps
          save_steps: 200
          save_total_limit: 6
