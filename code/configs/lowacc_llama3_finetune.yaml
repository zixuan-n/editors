quantization:
  load_in_4bit: true
  # bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules:
    # --- Llama/Qwen/Gemma-style attention projections (old) ---
    - q_proj
    - k_proj
    - v_proj
    # - o_proj
    # - gate_proj
    # - up_proj
    # - down_proj

    # --- Phi-3/4-style (common naming) ---
    # - qkv_proj
    # - o_proj
    # - gate_up_proj
    # - down_proj

    # --- Qwen2.5 / Llama / Gemma-2 style ---
    # - q_proj
    # - v_proj

