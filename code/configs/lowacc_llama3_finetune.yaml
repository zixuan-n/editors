  # output_dir: outputs/lowacc_real_compensated_verified
  # output_dir: outputs/lowacc_real_compensated_random
  output_dir: outputs/lowacc_fake_12600
  # output_dir: outputs/lowacc_mix_deflated_gemma
  # output_dir: outputs/lowacc_mix_deflated_llama
  # output_dir: outputs/llama3_CCAT50_8
  # output_dir: outputs/llama3_imdb
  num_train_epochs: 4
  per_device_train_batch_size: 12
  gradient_accumulation_steps: 2
  per_device_eval_batch_size: 1
  learning_rate: 0.0002
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 6
  bf16: true
  gradient_checkpointing: true
  max_grad_norm: 0.3
  eval_strategy: steps
  save_strategy: steps
  logging_strategy: steps
  pad_to_multiple_of: 8

generation:
  max_new_tokens: 8

