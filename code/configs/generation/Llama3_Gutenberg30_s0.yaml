# Optional 4-epoch domain warm-up (paper Appendix F.2).
model:
  name: meta-llama/Llama-3.1-8B-Instruct
  trust_remote_code: false
  max_seq_length: 1024
quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules:
  - q_proj
  - k_proj
  - v_proj
data:
  train_path: data/Gutenberg30/train.jsonl
  eval_path: data/Gutenberg30/eval.jsonl
  test_path: data/Gutenberg30/test.jsonl
  summary_field: content_pack
  text_field: text
  author_field: author
  max_seq_length: 1024
  seed: 1234
training:
  output_dir: outputs/generation/Gutenberg30/s0
  num_train_epochs: 4
  per_device_train_batch_size: 12
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 4
  learning_rate: 0.0002
  weight_decay: 0.01
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  logging_steps: 10
  eval_steps: 200
  save_steps: 200
  save_total_limit: 5
  bf16: true
  gradient_checkpointing: true
  max_grad_norm: 0.3
  eval_strategy: steps
  save_strategy: steps
  logging_strategy: steps
  pad_to_multiple_of: 8
  report_to: none
  seed: 1234
  gradient_checkpointing_kwargs:
    use_reentrant: false
generation:
  max_new_tokens: 1024
loss_logging:
  csv_path: outputs/generation/Gutenberg30/s0/loss_history.csv
prompt:
  system_prompt: |
    You are a writing assistant that creates original literary paragraphs. Write a new paragraph in the style of the specified author. Do not copy the source text.
  template: |
    <|start_header_id|>system<|end_header_id|>
    {system_prompt}
    <|eot_id|><|start_header_id|>user<|end_header_id|>
    Author: {author}
    Task: Write a new literary paragraph.
    <|eot_id|><|start_header_id|>assistant<|end_header_id|>
  answer_prefix: ''
