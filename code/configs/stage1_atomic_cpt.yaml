  # --- New (Llama-3 8B Instruct) ---
  model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
  torch_dtype: bfloat16
  attn_implementation: null
  trust_remote_code: false
  load_in_4bit: true
  load_in_8bit: false
  bnb_4bit_compute_dtype: bfloat16
  device_map: "auto"
  # --- Optional: start from an existing LoRA adapter ---
  adapter_name_or_path: outputs/llama3_lowacc_lora
  adapter_is_trainable: true   # true = continue training that adapter
  merge_adapter: true          # true = merge adapter into base weights

data:
  # train_path: stage1_CCAT_atomic_facts_concat.jsonl
  # eval_path: stage1_CCAT_atomic_facts_eval_concat.jsonl
  # train_path: stage1_reuter_c50_10authors_100w_keep50_atomic_facts_concat.jsonl
  # eval_path: stage1_reuter_c50_10authors_100w_keep50_atomic_facts_eval_concat.jsonl
  # --- Blogtext 10 (train/eval split) ---
  # train_path: splits/blogs10/stage1_blogs10_atomic_facts_train_concat.jsonl
  # eval_path: splits/blogs10/stage1_blogs10_atomic_facts_eval_concat.jsonl
  # --- Lowacc mix ---
  # train_path: splits/lowacc_mix/stage1_lowacc_generated_atomic_facts_concat.jsonl
  # --- Blogtext 50 (train/eval split) ---
  # train_path: splits/blogs50_80/stage1_blogs50_80_atomic_facts_train_concat.jsonl
  # eval_path: splits/blogs50_80/stage1_blogs50_80_atomic_facts_eval_concat.jsonl
  # --- CCAT50 (train/eval split) ---
  # train_path: splits/CCAT50/stage1_CCAT50_atomic_facts_train_concat.jsonl
  # eval_path: splits/CCAT50/stage1_CCAT50_atomic_facts_eval_concat.jsonl
  # --- IMDB (top10) ---
  # train_path: stage1_imdb_atomic_facts_concat.jsonl
  # eval_path: stage1_imdb_atomic_facts_eval_concat.jsonl
  # --- Blogtext (300w/100p, diverse 10 authors) ---
  # train_path: stage1_blogtext_10authors_300w_100p_diverse_atomic_facts_concat.jsonl
  # eval_path: stage1_blogtext_10authors_300w_100p_diverse_atomic_facts_eval_concat.jsonl
  # --- Blogtext (300w/100p, Technology topic) ---
  # train_path: stage1_blogtext_10authors_300w_100p_technology_atomic_facts_concat.jsonl
  # eval_path: stage1_blogtext_10authors_300w_100p_technology_atomic_facts_eval_concat.jsonl
  train_path: splits/lowacc_authors/stage1_lowacc_atomic_facts_concat.jsonl
  eval_path: splits/lowacc_authors/stage1_lowacc_atomic_facts_eval_concat.jsonl
  text_column: text
  preprocessing_num_workers: 4
  packing: false
  max_seq_length: 768
  shuffle: true
  seed: 1234

lora:
  enabled: true
  adapter_name: stage1  # name for the new adapter if stacking on an existing one
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules:
    # --- Phi-3/4-style (common naming) ---
    # - qkv_proj
    # - o_proj
    # - gate_up_proj
    # - down_proj

    # --- Qwen/Llama/Gemma-style attention projections ---
    - q_proj
    - k_proj
    - v_proj
    # Optional:
    # - k_proj
    # - o_proj
    # - gate_proj
    # - up_proj
    # - down_proj
  bias: none
  task_type: CAUSAL_LM

training:
  # output_dir: outputs/llama3_atomic_cpt_stage1_imdb_6
  # output_dir: outputs/Qwen_atomic_cpt_stage1_CCAT
  # output_dir: outputs/Mistral_atomic_cpt_stage1_CCAT
  # output_dir: outputs/Gemma2_atomic_cpt_stage1_CCAT
  # output_dir: outputs/Gemma2_atomic_cpt_stage1_lowacc
  # output_dir: outputs/Phi4mini_atomic_cpt_stage1_CCAT
  # output_dir: outputs/Phi4mini_atomic_cpt_stage1_lowacc
  # output_dir: outputs/Qwen25_7B_atomic_cpt_stage1_CCAT
  # output_dir: outputs/Llama3_8B_atomic_cpt_stage1_reuter_100w_keep50
  # output_dir: outputs/Llama3_8B_atomic_cpt_stage1_lowacc
  # output_dir: outputs/Llama3_8B_atomic_cpt_stage1_blogtext_300w_100p_technology
  # output_dir: outputs/Phi4mini_atomic_cpt_stage1_blogs50
  # output_dir: outputs/llama3_atomic_cpt_stage1_blogs50_80
  # output_dir: outputs/llama3_atomic_cpt_stage1_blogs10
  #output_dir: outputs/llama3_atomic_cpt_stage1_lowacc_fake
  output_dir: outputs/llama3_atomic_cpt_stage1_lowacc
  # output_dir: outputs/llama3_atomic_cpt_stage1_CCAT50
  num_train_epochs: 4
  per_device_train_batch_size: 12
  gradient_accumulation_steps: 2
  per_device_eval_batch_size: 1
  learning_rate: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  logging_strategy: steps
  save_strategy: steps
  save_steps: 200
  save_total_limit: 6
  # eval_strategy: steps
  eval_steps: 200
  bf16: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  remove_unused_columns: true
  dataloader_num_workers: 0
  report_to:
    - wandb
  # run_name: stage1_atomic_cpt_CCAT
  # run_name: stage1_atomic_cpt_CCAT_gemma2
  # run_name: stage1_atomic_cpt_CCAT_phi4mini
  # run_name: stage1_atomic_cpt_CCAT_qwen25_7b
  # run_name: stage1_atomic_cpt_reuter_100w_keep50_llama3_8b
  # run_name: stage1_atomic_cpt_lowacc_llama3_8b
  # run_name: stage1_atomic_cpt_lowacc_gemma2
  # run_name: stage1_atomic_cpt_blogs50_80_llama3
  # run_name: stage1_atomic_cpt_blogs10_llama3
  # run_name: stage1_atomic_cpt_lowacc_fake_llama3
  run_name: stage1_atomic_cpt_lowacc_llama3
  # run_name: stage1_atomic_cpt_CCAT50_phi4mini
  # run_name: stage1_atomic_cpt_CCAT50_llama3
  # run_name: stage1_atomic_cpt_blogtext_300w_100p_technology_llama3_8b
  seed: 1234
