  # name: Qwen/Qwen2.5-7B-Instruct
  # --- New (Llama-3.1 8B Instruct) ---
  name: meta-llama/Llama-3.1-8B-Instruct
  #init_stage2_from_base: false
  init_stage2_from_base: true
  #stage2_adapter_path: outputs/llama_CCAT  # path to the Stage-2 LoRA you want to continue
  # stage2_adapter_path: outputs/Qwen_CCAT
  # stage2_adapter_path: outputs/Mistral_CCAT
