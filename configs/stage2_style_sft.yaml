  # run_name: deflated_llama3_CCAT50_deltaW_warmup
  # run_name: deflated_Llama3_8B_blogtext_300w_100p_technology_deltaW
  # run_name: deflated_lowacc_fake_from_base
  run_name: deflated_lowacc_real_3600_from_base
  report_to:
    - wandb

