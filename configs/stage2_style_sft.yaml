  # stage1_adapter_path: outputs/Phi4mini_atomic_cpt_stage1_CCAT
  # stage1_adapter_path: outputs/Qwen25_7B_atomic_cpt_stage1_CCAT
  # stage1_adapter_path: outputs/Llama3_8B_atomic_cpt_stage1_reuter_100w_keep50
  # stage1_adapter_path: outputs/llama3_atomic_cpt_stage1_blogs50
  # stage1_adapter_path: outputs/llama3_atomic_cpt_stage1_blogs10
  # stage1_adapter_path: outputs/llama3_atomic_cpt_stage1_lowacc_fake
  stage1_adapter_path: outputs/llama3_atomic_cpt_stage1
  # stage1_adapter_path: outputs/llama3_atomic_cpt_stage1_CCAT50
  # stage1_adapter_path: outputs/Llama3_8B_atomic_cpt_stage1_blogtext_300w_100p_technology
  torch_dtype: bfloat16
  # attn_implementation: flash_attention_2
  attn_implementation: null
  trust_remote_code: false
  device_map: "auto"

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.1
  target_modules:
    # --- Phi-3/4-style (common naming) ---
    # - qkv_proj
    # - o_proj
    # - gate_up_proj
    # - down_proj

    # --- Qwen/Llama/Gemma-style attention/MLP projections ---
    - q_proj
    - k_proj
    - v_proj
    # Optional:
    # - k_proj
    # - o_proj
    # - gate_proj
    # - up_proj
    # - down_proj

deflation:
  # Build deflation bases from the Stage-1 adapter weights.
  # Options: lora_A (old behavior) or deltaW (more robust to LoRA factor rotations).
  basis_type: deltaW
  basis_tol: 1e-6
  # Optional substring filter on Stage-1 module names when building bases.
  # Phi-3/4 include list (old):
  # include_module:
  #   - qkv_proj
  #   - o_proj
  #   - gate_up_proj
  #   - down_proj

  # Qwen/Llama include list:
  include_module:
    - q_proj
    - k_proj
    - v_proj
  # Runtime logging (printed at Trainer logging steps) + final CSV summary.
  sample_every: 10
  log_topk: 5
  # log_csv: outputs/deflated_Qwen_CCAT_deltaW/deflation_stats.csv
  # log_csv: outputs/deflated_Mistral_CCAT_deltaW/deflation_stats.csv
  # log_csv: outputs/deflated_Gemma2_CCAT_deltaW/deflation_stats.csv
  # log_csv: outputs/deflated_Phi4mini_CCAT_deltaW/deflation_stats.csv
  # log_csv: outputs/deflated_Qwen25_7B_CCAT_deltaW/deflation_stats.csv
  # log_csv: outputs/deflated_Llama3_8B_reuter_100w_keep50_deltaW/deflation_stats.csv
  # log_csv: outputs/deflated_llama3_blogs10_deltaW/deflation_stats.csv
  # log_csv: outputs/deflated_llama3_blogs50_80_deltaW_3/deflation_stats.csv
  # log_csv: output/deflated_lowacc_fake/deflation_stats.csv
  # log_csv: output/deflated_lowacc_fake_from_base/deflation_stats.csv
  log_csv: output/deflated_lowacc_real_3600_from_base/deflation_stats.csv
  # log_csv: outputs/deflated_llama3_CCAT50_deltaW_2/deflation_stats.csv
  # log_csv: outputs/deflated_Llama3_8B_blogtext_300w_100p_technology_deltaW/deflation_stats.csv
  # Optional: persist computed bases for reuse/debugging.
  # save_u_sem: stage_evaluation/u_sem_Qwen_deltaW.pt
  # save_u_sem: stage_evaluation/u_sem_Mistral_deltaW.pt
  # save_u_sem: stage_evaluation/u_sem_Gemma2_deltaW.pt
  # save_u_sem: stage_evaluation/u_sem_Phi4mini_deltaW.pt
  # save_u_sem: stage_evaluation/u_sem_Qwen25_7B_deltaW.pt
  # save_u_sem: stage_evaluation/u_sem_Llama3_8B_reuter_100w_keep50_deltaW.pt
  # save_u_sem: stage_evaluation/u_sem_llama3_blogs10_deltaW.pt
  # save_u_sem: stage_evaluation/u_sem_llama3_blogs50_80_deltaW_3.pt
  # save_u_sem: stage_evaluation/u_sem_lowacc_fake.pt
  save_u_sem: stage_evaluation/u_sem_lowacc_real_3600_from_base.pt
  # save_u_sem: stage_evaluation/u_sem_deflated_lowacc_from_base_Gemma.pt
  # save_u_sem: stage_evaluation/u_sem_llama3_CCAT50_deltaW_2.pt
