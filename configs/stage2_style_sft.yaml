  # train_path: splits/blogtext_10authors_300w_100p_technology/train.jsonl
  # eval_path: splits/blogtext_10authors_300w_100p_technology/eval.jsonl
  # test_path: splits/blogtext_10authors_300w_100p_technology/test.jsonl
  text_field: text
  label_field: author
  max_seq_length: 1000
  seed: 1234

prompt:
  system_prompt: >
    You are an expert literary analyst. Identify the author of the provided passage based on their writing style instead of the content.
    Answer with only the exact author name. 
  # system_prompt: >
  #   You are an expert literary analyst. Identify the author of the provided passage. Answer with only the exact author name.
  # --- Llama-3 Instruct (header tokens) ---
  # system_prompt: >
  #   You are an expert literary analyst. Identify the author of the provided passage based on their writing style instead of the content.
  #   Answer with only the exact user ID.
  template: |
    <|start_header_id|>system<|end_header_id|>
    {system_prompt}
    <|eot_id|><|start_header_id|>user<|end_header_id|>
    Passage:
    {passage}
    Author:
    <|eot_id|><|start_header_id|>assistant<|end_header_id|>
  
  # --- Mistral Instruct v0.3 ---
  # template: |
  #   <s>[INST] {system_prompt}
  #
  #   Passage:
  #   {passage}
  #   Author: [/INST]

  # --- Qwen Instruct (ChatML) ---
  # template: |
  #   <|im_start|>system
  #   {system_prompt}<|im_end|>
  #   <|im_start|>user
  #   Passage:
  #   {passage}
  #   Author:<|im_end|>
  #   <|im_start|>assistant

  # --- Gemma-2 IT ---
  # template: |
  #   <start_of_turn>user
  #   {system_prompt}
  
  #   Passage:
  #   {passage}
  #   Author:
  #   <end_of_turn>
  #   <start_of_turn>model

  # --- Phi-4 mini (use tokenizer.chat_template) ---
  # template: auto
  # --- Qwen2.5 Instruct (ChatML, optional) ---
  # (Same as Qwen ChatML above; keep this block for easy toggling.)
  answer_prefix: " "
