  # output_dir: output/deflated_lowacc_fake_from_base
  output_dir: output/deflated_lowacc_real_3600_from_base
  num_train_epochs: 4
  per_device_train_batch_size: 12
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_steps: 200
  save_total_limit: 30
  bf16: true
  # run_name: deflated_Qwen_CCAT_deltaW
  # run_name: deflated_Mistral_CCAT_deltaW
  # run_name: deflated_Gemma2_CCAT_deltaW
  # run_name: deflated_Phi4mini_CCAT_deltaW
