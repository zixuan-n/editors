  # stage1_adapter_path: outputs/Qwen_atomic_cpt_stage1_CCAT
  # stage1_adapter_path: outputs/Mistral_atomic_cpt_stage1_CCAT
  # stage1_adapter_path: outputs/Gemma2_atomic_cpt_stage1_CCAT
